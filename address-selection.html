<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Address Selection</title>
    <link rel="stylesheet" href="address-selection.css" />
    <script
      type="module"
      src="https://unpkg.com/@googlemaps/extended-component-library?module"
    ></script>
    <script src="address-selection.js" type="module"></script>
  </head>
  <body>
    <gmpx-api-loader
      key="YOUR_API_KEY_HERE"
      solution-channel="GMP_QB_addressselection_v4_cABC"
    >
    </gmpx-api-loader>
    <gmpx-split-layout row-layout-min-width="600">
      <div class="panel" slot="fixed">
        <div class="panel-title-row">
          <img
            class="sb-title-icon"
            src="https://fonts.gstatic.com/s/i/googlematerialicons/location_pin/v5/24px.svg"
            alt=""
          />
          <span class="sb-title">Address Selection</span>
        </div>
        <p class="panel-note">
          Substitua <strong>YOUR_API_KEY_HERE</strong> por uma chave válida do
          Google Maps Platform para habilitar o autocomplete e o mapa.
        </p>
        <input type="text" placeholder="Address" id="location-input" />
        <input type="text" placeholder="Apt, Suite, etc (optional)" />
        <input type="text" placeholder="City" id="locality-input" />
        <div class="half-input-container">
          <input
            type="text"
            class="half-input"
            placeholder="State/Province"
            id="administrative_area_level_1-input"
          />
          <input
            type="text"
            class="half-input"
            placeholder="Zip/Postal code"
            id="postal_code-input"
          />
        </div>
        <input type="text" placeholder="Country" id="country-input" />
        <gmpx-icon-button variant="filled">Checkout</gmpx-icon-button>
      </div>
      <gmp-map
        slot="main"
        center="-25.5313,-49.2031"
        zoom="12"
        map-id="DEMO_MAP_ID"
      >
        <gmp-advanced-marker></gmp-advanced-marker>
      </gmp-map>
    </gmpx-split-layout>
  </body>
</html>
